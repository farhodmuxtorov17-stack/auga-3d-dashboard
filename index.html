<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Smart Asset Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#7BC142; --green-dark:#5FA830; --green-light:#E8F5E9; --green-bg:#F0F9EB;
  --bg:#F4F4F6; --card:#FFFFFF; --border:#E8E8EC; --border-light:#F0F0F4;
  --text:#1A1D23; --text-2:#555A66; --text-3:#8C919D; --text-4:#B0B5BF;
  --blue:#2D7FF9; --orange:#F97316; --red:#EF4444; --yellow:#F59E0B;
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06); --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-md:0 4px 20px rgba(0,0,0,.08); --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --sidebar-w:248px;
}
html,body{height:100%;font-family:'Onest',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input{font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#D0D5DB;border-radius:3px}

/* ============ LOGIN ============ */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAFBFC;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;top:-200px;left:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(123,193,66,.06) 0%,transparent 70%)}
.login-page::after{content:'';position:absolute;bottom:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(123,193,66,.06) 0%,transparent 70%)}
.login-card{position:relative;width:420px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;box-shadow:var(--shadow-md);z:1}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo img{width:36px;height:36px}
.login-logo span{font-size:22px;font-weight:800;letter-spacing:-.5px}
.login-card h1{font-size:24px;font-weight:700;margin-bottom:6px}
.login-card .sub{color:var(--text-3);font-size:14px;margin-bottom:24px}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.field-wrap{position:relative}
.field-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.field-wrap input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;background:#FAFBFC}
.field-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(123,193,66,.12);background:#fff}
.field-wrap .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3);cursor:pointer;padding:4px}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 20px}
.check-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.check-line input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
.forgot-link{font-size:13px;color:var(--green);font-weight:500}
.login-btn{width:100%;height:46px;background:var(--green);color:#fff;border-radius:var(--radius-sm);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .1s}
.login-btn:hover{background:var(--green-dark)}
.login-btn:active{transform:scale(.98)}
.role-section{margin-top:24px}
.role-label{font-size:13px;font-weight:500;color:var(--text-3);margin-bottom:8px;text-align:center}
.role-tabs{display:flex;gap:8px}
.role-tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-2);background:#fff;transition:all .2s}
.role-tab.active{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.demo-note{text-align:center;margin-top:16px;font-size:12px;color:var(--text-4)}

/* ============ APP LAYOUT ============ */
.app{display:flex;height:100vh;overflow:hidden}

/* ---- Sidebar ---- */
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border-light)}
.sidebar-logo img{width:28px;height:28px}
.sidebar-logo span{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text-2);transition:all .15s;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:#F8F9FB;color:var(--text)}
.nav-item.active{background:var(--green-bg);color:var(--green-dark)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--green);color:#fff}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border-light)}
.sidebar-footer .nav-item{font-size:13px;color:var(--text-3)}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;flex-shrink:0}
.search-box{flex:0 0 320px;position:relative}
.search-box input{width:100%;height:38px;padding:0 12px 0 38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:#FAFBFC;outline:none}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(123,193,66,.1)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.topbar-spacer{flex:1}
.topbar-info{display:flex;align-items:center;gap:20px}
.weather-pill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.time-display{font-size:13px;color:var(--text-2);font-weight:500}
.notif-btn{position:relative;width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:background .2s}
.notif-btn:hover{background:#F5F6F8}
.notif-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--card)}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.user-name{font-size:13px;font-weight:500}
.user-role{font-size:11px;color:var(--text-3)}
.report-btn{height:38px;padding:0 16px;background:var(--green);color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .2s}
.report-btn:hover{background:var(--green-dark)}

/* ---- Content ---- */
.content{flex:1;overflow-y:auto;padding:24px}
.page-title{font-size:22px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.page-title .count-badge{font-size:13px;font-weight:500;color:var(--text-3);background:var(--card);padding:4px 12px;border-radius:20px;border:1px solid var(--border)}

/* ---- KPI Cards ---- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s}
.kpi-card:hover{box-shadow:var(--shadow-md)}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.kpi-icon.dark{background:#1A1D23;color:#fff}
.kpi-icon.green{background:var(--green-bg);color:var(--green)}
.kpi-icon img{width:36px;height:36px;border-radius:8px}
.kpi-label{font-size:13px;color:var(--text-3);font-weight:500}
.kpi-value{font-size:28px;font-weight:700;letter-spacing:-.5px}
.kpi-value .unit{font-size:14px;font-weight:500;color:var(--text-3);margin-left:4px}
.kpi-trend{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.kpi-trend.up{color:var(--green)}
.kpi-trend.down{color:var(--red)}

/* ---- Map Section ---- */
.map-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;display:grid;grid-template-columns:1fr 280px}
.map-main{position:relative;padding:20px}
.map-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.map-header h3{font-size:16px;font-weight:600}
.map-header .badge{font-size:12px;color:var(--text-3);background:#F5F6F8;padding:4px 10px;border-radius:16px}
.map-view{position:relative;width:100%;height:400px;border-radius:var(--radius-sm);overflow:hidden;background:linear-gradient(135deg,#E8F5E9 0%,#E3F2FD 100%)}
.map-view img{width:100%;height:100%;object-fit:cover}
.map-marker{position:absolute;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;transition:transform .2s;z-index:2}
.map-marker:hover{transform:scale(1.3);z-index:3}
.map-marker.active{background:var(--green)}
.map-marker.planned{background:var(--blue)}
.map-marker.maintenance{background:var(--orange)}
.map-marker.selected{transform:scale(1.4);box-shadow:0 0 0 6px rgba(123,193,66,.2),0 2px 8px rgba(0,0,0,.2);z-index:3}
.map-tooltip{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow-lg);z-index:10;min-width:200px;pointer-events:none}
.map-tooltip .tt-name{font-weight:600;font-size:13px;margin-bottom:4px}
.map-tooltip .tt-type{font-size:12px;color:var(--text-3);margin-bottom:6px}
.map-tooltip .tt-val{font-size:14px;font-weight:600;color:var(--green-dark)}
.map-controls{position:absolute;top:16px;right:16px;display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;z-index:5}
.map-controls button{padding:6px 12px;font-size:12px;border-radius:6px;font-weight:500;color:var(--text-3)}
.map-controls button.active{background:var(--green);color:#fff}

/* ---- Filters Sidebar ---- */
.filters-panel{border-left:1px solid var(--border-light);padding:20px;display:flex;flex-direction:column;gap:16px}
.filters-panel h3{font-size:15px;font-weight:600;margin-bottom:4px}
.filter-select{width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:#FAFBFC;outline:none;cursor:pointer}
.filter-list{display:flex;flex-direction:column;gap:8px}
.filter-item{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:8px;border-radius:var(--radius-sm);transition:background .15s}
.filter-item:hover{background:#F8F9FB}
.filter-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.filter-item .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-3)}
.filter-item.active{background:var(--green-light)}

/* ---- Bottom Section ---- */
.bottom-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.bottom-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.bottom-card h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.bottom-card h3 a{font-size:12px;color:var(--green);font-weight:500}

/* Recent Assets */
.recent-assets{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.recent-asset{flex:0 0 160px;border:1px solid var(--border-light);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.recent-asset:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.recent-asset img{width:100%;height:100px;object-fit:cover;background:#F5F6F8}
.recent-asset .ra-info{padding:10px}
.recent-asset .ra-name{font-size:13px;font-weight:600;margin-bottom:2px}
.recent-asset .ra-type{font-size:11px;color:var(--text-3)}
.recent-asset .ra-value{font-size:12px;font-weight:600;color:var(--green-dark);margin-top:4px}

/* Donut Chart */
.donut-wrap{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.donut-chart{position:relative;width:160px;height:160px}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .dc-value{font-size:24px;font-weight:700}
.donut-center .dc-label{font-size:11px;color:var(--text-3)}
.donut-legend{display:flex;flex-direction:column;gap:6px;width:100%}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.donut-legend-item .dot{width:8px;height:8px;border-radius:50%}
.donut-legend-item .val{margin-left:auto;font-weight:600}

/* Quick Reminders */
.reminder-list{display:flex;flex-direction:column;gap:10px}
.reminder-item{display:flex;gap:10px;padding:10px;border:1px solid var(--border-light);border-radius:var(--radius-sm)}
.reminder-item .ri-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reminder-item .ri-icon.green{background:var(--green-bg);color:var(--green)}
.reminder-item .ri-icon.orange{background:#FFF3E0;color:var(--orange)}
.reminder-item .ri-icon.blue{background:#E3F2FD;color:var(--blue)}
.reminder-item .ri-text{font-size:13px;font-weight:500;line-height:1.3}
.reminder-item .ri-time{font-size:11px;color:var(--text-3);margin-top:2px}
.reminder-item .ri-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;background:#FEF3C7;color:#92400E;margin-left:auto;align-self:flex-start}

/* ============ PAGE: ASSET LIST ============ */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.toolbar .search-box{flex:0 0 280px}
.toolbar select{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);cursor:pointer;outline:none}
.toolbar-spacer{flex:1}
.export-btn{height:38px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-2);display:flex;align-items:center;gap:6px;background:var(--card)}
.new-asset-btn{height:38px;padding:0 16px;background:var(--green);color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.new-asset-btn:hover{background:var(--green-dark)}
.asset-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.asset-table table{width:100%;border-collapse:collapse}
.asset-table th{text-align:left;padding:14px 16px;font-size:12px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--border);background:#FAFBFC;text-transform:uppercase;letter-spacing:.5px}
.asset-table td{padding:14px 16px;border-bottom:1px solid var(--border-light);font-size:13px}
.asset-table tr:hover td{background:#F8F9FB}
.asset-table tr:last-child td{border-bottom:none}
.asset-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#F5F6F8}
.asset-name-cell{display:flex;align-items:center;gap:10px}
.asset-name-cell .name{font-weight:600}
.asset-name-cell .id{font-size:11px;color:var(--text-3)}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500}
.status-badge.active{background:var(--green-bg);color:var(--green-dark)}
.status-badge.planned{background:#E3F2FD;color:var(--blue)}
.status-badge.maintenance{background:#FFF3E0;color:var(--orange)}
.status-badge .dot{width:6px;height:6px;border-radius:50%}

/* ============ PAGE: OBJECT 360 ============ */
.obj360-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.obj360-header h2{font-size:20px;font-weight:700}
.obj360-header .obj-id{font-size:13px;color:var(--text-3)}
.obj360-header .eff-badge{margin-left:auto;padding:6px 14px;background:var(--green);color:#fff;border-radius:20px;font-size:12px;font-weight:600}
.obj360-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.obj360-visual{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative}
.obj360-render{width:100%;height:320px;border-radius:var(--radius-sm);overflow:hidden;background:linear-gradient(180deg,#F0F9EB 0%,#E8F5E9 100%);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.obj360-render img{max-width:100%;max-height:100%;object-fit:contain}
.obj360-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.obj360-kpi{text-align:center;padding:12px;border:1px solid var(--border-light);border-radius:var(--radius-sm)}
.obj360-kpi .ok-icon{width:32px;height:32px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.obj360-kpi .ok-icon img{width:28px;height:28px}
.obj360-kpi .ok-label{font-size:11px;color:var(--text-3);margin-bottom:2px}
.obj360-kpi .ok-value{font-size:16px;font-weight:700}
.obj360-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.obj360-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;cursor:pointer}
.obj360-tab.active{color:var(--green-dark);border-bottom-color:var(--green)}
.obj360-side{display:flex;flex-direction:column;gap:16px}
.obj360-gallery{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.obj360-gallery h4{font-size:13px;font-weight:600;margin-bottom:12px}
.gallery-row{display:flex;gap:8px;overflow-x:auto}
.gallery-row img{width:80px;height:60px;border-radius:6px;object-fit:cover;background:#F5F6F8}
.obj360-history{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.obj360-history h4{font-size:13px;font-weight:600;margin-bottom:12px}
.history-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.history-item:last-child{border-bottom:none}
.history-item .hi-icon{width:24px;height:24px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.history-item .hi-text{font-size:12px;font-weight:500}
.history-item .hi-time{font-size:11px;color:var(--text-3)}

/* ============ ERROR STATES ============ */
.error-page{padding:40px 24px}
.error-header{text-align:center;margin-bottom:32px}
.error-header h2{font-size:24px;font-weight:700}
.error-header p{font-size:14px;color:var(--text-3);margin-top:6px}
.error-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:1400px;margin:0 auto}
.error-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:box-shadow .2s}
.error-card:hover{box-shadow:var(--shadow-md)}
.error-card .ec-icon{width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.error-card .ec-icon img{width:64px;height:64px;object-fit:contain}
.error-card .ec-icon svg{width:48px;height:48px}
.error-card .ec-title{font-size:14px;font-weight:600}
.error-card .ec-desc{font-size:12px;color:var(--text-3);line-height:1.4}
.error-card .ec-btn{margin-top:4px;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;transition:background .2s}
.error-card .ec-btn.green{background:var(--green);color:#fff}
.error-card .ec-btn.green:hover{background:var(--green-dark)}
.error-card .ec-btn.red{background:var(--red);color:#fff}
.error-card .ec-btn.red:hover{background:#DC2626}
.error-card .ec-progress{width:100%;height:6px;background:#F0F0F4;border-radius:3px;overflow:hidden}
.error-card .ec-progress-bar{height:100%;background:var(--green);border-radius:3px;transition:width .3s}

let selectedRole = 'rahbar';
let selectedMarkerId = null;

// ============ LOGIN ============
function togglePass(){const p=document.getElementById('loginPass');p.type=p.type==='password'?'text':'password'}
function selectRole(el,role){document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');selectedRole=role;
  const names={rahbar:'Akmalov A.',operator:'Karimov K.',texnik:'Sodiqov S.'};
  const roles={rahbar:'Rahbar',operator:'Operator',texnik:'Texnik xodim'};
  document.getElementById('userName').textContent=names[role];
  document.getElementById('userRole').textContent=roles[role];
}
function doLogin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appMain').style.display='flex';
  buildSidebar();
  navigateTo('dashboard');
  startTime();
}

// ============ SIDEBAR ============
function buildSidebar(){
  const nav=document.getElementById('sidebarNav');
  nav.innerHTML=NAV_ITEMS.map(item=>`
    <div class="nav-item ${item.page==='dashboard'?'active':''}" data-page="${item.page}" onclick="navigateTo('${item.page}')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[item.icon]||''}</svg>
      <span>${item.label}</span>
      ${item.badge?`<span class="badge">${item.badge}</span>`:''}
    </div>
  `).join('');
}

function navigateTo(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  const content=document.getElementById('contentArea');
  content.innerHTML=renderPage(page);
  content.scrollTop=0;
  if(page==='dashboard')initMap();
}

// ============ PAGE RENDERERS ============
function renderPage(page){
  switch(page){
    case'dashboard':return renderDashboard();
    case'assets':return renderAssets();
    case'errors':return renderErrors();
    case'real-estate':return renderAssets();
    case'leasing':return renderComingSoon('Lizing','Lizing shartnomalari boshqaruvi');
    case'contracts':return renderComingSoon('Shartnomalar','Shartnomalar ro\'yxati va boshqaruvi');
    case'expenses':return renderComingSoon('Xarajatlar','Xarajatlar hisoboti');
    case'reports':return renderComingSoon('Hisobotlar','Tahlil va hisobotlar');
    case'notifications':return renderComingSoon('Bildirishnomalar','Tizim bildirishnomalari');
    case'access':return renderComingSoon('Smart Access','Kirish nazorati va Face ID');
    case'storage':return renderComingSoon('Ma\'lumotlarni saqlash','Ma\'lumotlar arxivi');
    case'audit':return renderComingSoon('Audit jurnali','Tizim audit loglari');
    case'settings':return renderComingSoon('Sozlamalar','Tizim sozlamalari');
    default:return renderDashboard();
  }
}

function renderComingSoon(title,desc){
  return `<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px">
    <img src="${IMG.buildingSet}" style="width:120px;height:120px;opacity:.5">
    <h2 style="font-size:20px;font-weight:700">${title}</h2>
    <p style="color:var(--text-3)">${desc}</p>
  </div>`;
}

            <div class="kpi-value">${k.value}<span class="unit">${k.unit}</span></div>

// ============ MAP INTERACTION ============
function initMap(){}
function selectMarker(id){
  selectedMarkerId=id;
  const m=MAP_MARKERS.find(x=>x.id===id);
  if(!m)return;
  document.querySelectorAll('.map-marker').forEach(el=>el.classList.remove('selected'));
  // Re-render markers
  navigateTo('dashboard');
  selectedMarkerId=id;
  setTimeout(()=>{
    const el=document.querySelector(`.map-marker[onclick="selectMarker(${id})"]`);
    if(el)el.classList.add('selected');
  },50);
}
function showTooltip(id,e){
  const m=MAP_MARKERS.find(x=>x.id===id);
  if(!m)return;
  const tt=document.getElementById('mapTooltip');
  if(!tt)return;
  tt.innerHTML=`<div class="tt-name">${m.name}</div><div class="tt-type">${m.type}</div><div class="tt-val">${m.value}</div>`;
  tt.style.display='block';
  const rect=e.target.getBoundingClientRect();
  const parentRect=document.getElementById('mapView').getBoundingClientRect();
  tt.style.left=(rect.left-parentRect.left+20)+'px';
  tt.style.top=(rect.top-parentRect.top-10)+'px';
}
function hideTooltip(){
  const tt=document.getElementById('mapTooltip');
  if(tt)tt.style.display='none';
}
function toggleFilter(el){
  el.classList.toggle('active');
}

// ============ CLOCK ============
function startTime(){
  const update=()=>{
    const d=new Date();
    const h=String(d.getHours()).padStart(2,'0');
    const m=String(d.getMinutes()).padStart(2,'0');
    const el=document.getElementById('timeDisplay');
    if(el)el.textContent=`${h}:${m}`;
  };
  update();
  setInterval(update,1000);
}
</script>
