<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGA — Smart Asset Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ RESET ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#7BC142;--green-dark:#5FA830;--green-light:#E8F5E9;--green-bg:#F0F9EB;--green-50:#FAFCF7;
  --bg:#F4F5F7;--card:#FFFFFF;--border:#E8E9EC;--border-light:#F0F1F4;
  --text:#1A1D23;--text-2:#555A66;--text-3:#8C919D;--text-4:#B0B5BF;
  --blue:#2D7FF9;--blue-light:#E3F2FD;--orange:#F97316;--orange-light:#FFF3E0;
  --red:#EF4444;--red-light:#FEF2F2;--yellow:#F59E0B;--yellow-light:#FFFBEB;
  --purple:#8B5CF6;--purple-light:#F5F3FF;--teal:#14B8A6;--teal-light:#F0FDFA;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;--radius-xl:20px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);--shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow-md:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);--shadow-xl:0 16px 48px rgba(0,0,0,.12);
  --sidebar-w:260px;--topbar-h:64px;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;font-family:'Onest',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#D0D5DB;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#B0B5BF}
.slide-up{animation:slideUp .4s ease}@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pulse-red{animation:pulseRed 1.5s infinite}@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

/* ============ LOGIN ============ */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FAFBFC 0%,#F4F5F7 100%);position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;top:-200px;left:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(123,193,66,.08) 0%,transparent 70%)}
.login-page::after{content:'';position:absolute;bottom:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(123,193,66,.08) 0%,transparent 70%)}
.login-card{position:relative;width:440px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:44px 40px;box-shadow:0 8px 40px rgba(0,0,0,.08);z:1}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.login-logo .logo-icon{width:40px;height:40px}
.login-logo span{font-size:24px;font-weight:800;letter-spacing:-.5px}
.login-card h1{font-size:26px;font-weight:700;margin-bottom:8px}
.login-card .sub{color:var(--text-3);font-size:14px;margin-bottom:28px}
.field-group{margin-bottom:18px}
.field-group label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
.field-wrap{position:relative}
.field-wrap .icon-left{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.field-wrap input{width:100%;height:48px;padding:0 14px 0 44px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:var(--transition);background:#FAFBFC}
.field-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(123,193,66,.12);background:#fff}
.field-wrap input::placeholder{color:var(--text-4)}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);cursor:pointer;padding:4px}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 24px}
.check-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
.check-line input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);border-radius:4px}
.forgot-link{font-size:13px;color:var(--green);font-weight:600}
.login-btn{width:100%;height:48px;background:var(--green);color:#fff;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition);box-shadow:0 4px 12px rgba(123,193,66,.3)}
.login-btn:hover{background:var(--green-dark);transform:translateY(-1px);box-shadow:0 6px 16px rgba(123,193,66,.4)}
.login-btn:active{transform:translateY(0)}
.role-section{margin-top:28px;border-top:1px solid var(--border-light);padding-top:24px}
.role-label{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.role-tabs{display:flex;gap:10px}
.role-tab{flex:1;padding:12px 8px;border:1.5px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2);background:#fff;transition:var(--transition)}
.role-tab:hover{border-color:var(--green);background:var(--green-50)}
.role-tab.active{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.role-tab svg{width:20px;height:20px}
.demo-note{text-align:center;margin-top:20px;font-size:12px;color:var(--text-4)}

/* ============ APP LAYOUT ============ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z:10}
.sidebar-logo{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--border-light)}
.sidebar-logo .logo-icon{width:32px;height:32px}
.sidebar-logo span{font-size:19px;font-weight:800;letter-spacing:-.3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2);transition:var(--transition);cursor:pointer;margin-bottom:2px;position:relative}
.nav-item:hover{background:#F8F9FB;color:var(--text)}
.nav-item.active{background:var(--green-bg);color:var(--green-dark);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--green);border-radius:0 3px 3px 0}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--green);color:#fff}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border-light)}
.sidebar-footer .nav-item{font-size:13px;color:var(--text-3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;flex-shrink:0}
.search-box{flex:0 0 320px;position:relative}
.search-box input{width:100%;height:40px;padding:0 12px 0 40px;border:1px solid var(--border);border-radius:10px;font-size:13px;background:#FAFBFC;outline:none;transition:var(--transition)}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(123,193,66,.1);background:#fff}
.search-box .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.topbar-spacer{flex:1}
.topbar-info{display:flex;align-items:center;gap:20px}
.weather-pill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.time-display{font-size:13px;color:var(--text-2);font-weight:500}
.notif-btn{position:relative;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:var(--transition)}
.notif-btn:hover{background:#F5F6F8}
.notif-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--card)}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px;border-radius:10px;transition:var(--transition)}
.user-chip:hover{background:#F5F6F8}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--text-3)}
.report-btn{height:40px;padding:0 18px;background:var(--green);color:#fff;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:var(--transition);box-shadow:0 2px 8px rgba(123,193,66,.25)}
.report-btn:hover{background:var(--green-dark);transform:translateY(-1px)}
.content{flex:1;overflow-y:auto;padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.page-title .count-badge{font-size:13px;font-weight:600;color:var(--text-3);background:var(--card);padding:4px 12px;border-radius:20px;border:1px solid var(--border)}
.page-actions{display:flex;align-items:center;gap:10px}
.btn{height:40px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:var(--transition);border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px)}
.btn-outline{background:var(--card);color:var(--text-2);border-color:var(--border)}.btn-outline:hover{background:#FAFBFC;border-color:var(--text-4)}
.btn-ghost{background:transparent;color:var(--text-2)}.btn-ghost:hover{background:#F5F6F8}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#DC2626}
.btn-sm{height:32px;padding:0 12px;font-size:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:var(--transition);cursor:pointer}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--text-4)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between}
.kpi-icon{width:44px;height:44px;border-radius:12px;overflow:hidden}
.kpi-icon img{width:100%;height:100%;object-fit:cover}
.kpi-label{font-size:13px;color:var(--text-3);font-weight:500}
.kpi-value{font-size:28px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:4px}
.kpi-value .unit{font-size:13px;font-weight:500;color:var(--text-3)}
.kpi-trend{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.kpi-trend.up{color:var(--green)}
.kpi-trend.down{color:var(--red)}
.map-section{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px;display:grid;grid-template-columns:1fr 300px}
.map-main{position:relative;padding:20px}
.map-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.map-header h3{font-size:16px;font-weight:700}
.map-header .badge{font-size:12px;color:var(--text-3);background:#F5F6F8;padding:4px 12px;border-radius:20px}
.map-toggle{display:flex;background:#F5F6F8;border-radius:8px;padding:2px}
.map-toggle button{padding:6px 12px;font-size:12px;font-weight:600;border-radius:6px;color:var(--text-3);transition:var(--transition)}
.map-toggle button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-xs)}
.map-view{position:relative;width:100%;height:380px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#E8F5E9 0%,#E3F2FD 100%)}
.map-view img{width:100%;height:100%;object-fit:cover}
.map-marker{position:absolute;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;transition:var(--transition);z-index:2}
.map-marker:hover{transform:scale(1.4);z-index:3}
.map-marker.active{width:18px;height:18px;z-index:4}
.map-marker.active::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid currentColor;opacity:.3}
.map-tooltip{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow-md);font-size:13px;z-index:5;min-width:180px;pointer-events:none}
.map-tooltip h4{font-size:13px;font-weight:700;margin-bottom:4px}
.map-tooltip .meta{font-size:11px;color:var(--text-3);margin-bottom:2px}
.map-tooltip .val{font-size:15px;font-weight:700;color:var(--green-dark)}
.map-side{padding:20px;background:#FAFBFC;border-left:1px solid var(--border)}
.map-side h3{font-size:14px;font-weight:700;margin-bottom:16px}
.filter-select{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;background:var(--card);outline:none;margin-bottom:16px}
.filter-list{display:flex;flex-direction:column;gap:10px}
.filter-item{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:8px 10px;border-radius:8px;transition:var(--transition)}
.filter-item:hover{background:#F0F1F4}
.filter-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.filter-count{margin-left:auto;font-weight:600;color:var(--text-3);font-size:12px}
.filter-item.active{background:var(--card);box-shadow:var(--shadow-xs)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:16px;font-weight:700}
.section-header .link{font-size:13px;color:var(--green);font-weight:600;cursor:pointer}
.obj-carousel{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px}
.obj-carousel::-webkit-scrollbar{height:4px}
.obj-card{flex:0 0 240px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:var(--transition);cursor:pointer}
.obj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--text-4)}
.obj-card-img{width:100%;height:140px;overflow:hidden;background:#F5F6F8}
.obj-card-img img{width:100%;height:100%;object-fit:cover}
.obj-card-body{padding:14px}
.obj-card-name{font-size:14px;font-weight:700;margin-bottom:4px}
.obj-card-type{font-size:12px;color:var(--text-3);margin-bottom:8px}
.obj-card-value{font-size:16px;font-weight:700;color:var(--green-dark)}
.obj-card-value .unit{font-size:11px;font-weight:500;color:var(--text-3)}
.donut-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.donut-section h3{font-size:14px;font-weight:700;margin-bottom:16px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-chart{width:140px;height:140px;position:relative;flex-shrink:0}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .num{font-size:24px;font-weight:800}
.donut-center .lbl{font-size:11px;color:var(--text-3)}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:10px}
.donut-legend-item{display:flex;align-items:center;gap:10px;font-size:13px}
.donut-legend-item .dot{width:10px;height:10px;border-radius:50%}
.donut-legend-item .count{margin-left:auto;font-weight:700;color:var(--text-3)}
.alert-list{display:flex;flex-direction:column;gap:10px}
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:13px;transition:var(--transition);cursor:pointer}
.alert-item:hover{transform:translateX(4px)}
.alert-item.critical{background:var(--red-light);border:1px solid rgba(239,68,68,.2)}
.alert-item.warning{background:var(--yellow-light);border:1px solid rgba(245,158,11,.2)}
.alert-item.info{background:var(--blue-light);border:1px solid rgba(45,127,249,.15)}
.alert-item.success{background:var(--green-bg);border:1px solid rgba(123,193,66,.2)}
.alert-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-item.critical .alert-icon{background:rgba(239,68,68,.15);color:var(--red)}
.alert-item.warning .alert-icon{background:rgba(245,158,11,.15);color:var(--yellow)}
.alert-item.info .alert-icon{background:rgba(45,127,249,.15);color:var(--blue)}
.alert-item.success .alert-icon{background:rgba(123,193,66,.15);color:var(--green)}
.alert-text{flex:1}
.alert-text .title{font-weight:600}
.alert-text .time{font-size:11px;color:var(--text-3)}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-light)}
.table-toolbar .left{display:flex;align-items:center;gap:12px}
.table-toolbar h3{font-size:15px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border-light);white-space:nowrap}
tbody td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border-light)}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:#FAFBFC}
tbody tr:last-child td{border-bottom:none}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status-badge.active{background:var(--green-bg);color:var(--green-dark)}
.status-badge.maintenance{background:var(--yellow-light);color:var(--yellow)}
.status-badge.planned{background:var(--blue-light);color:var(--blue)}
.status-badge.offline{background:var(--red-light);color:var(--red)}
.status-badge.expiring{background:var(--orange-light);color:var(--orange)}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green)}
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.detail-title{font-size:24px;font-weight:700;margin-bottom:4px}
.detail-subtitle{font-size:14px;color:var(--text-3)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);margin-bottom:12px}
.breadcrumb a{color:var(--green);font-weight:500;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.detail-card h4{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-row .label{color:var(--text-3)}
.detail-row .val{font-weight:600}
.health-gauge{width:120px;height:120px;margin:0 auto 12px;position:relative}
.health-score{font-size:32px;font-weight:800;text-align:center}
.health-label{font-size:12px;color:var(--text-3);text-align:center}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.progress-bar{height:8px;background:#F0F1F4;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s ease}
.modal{background:var(--card);border-radius:16px;padding:28px;width:90%;max-width:480px;box-shadow:var(--shadow-xl);animation:slideUp .3s ease}
.modal h3{font-size:18px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--text-3);font-size:14px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.error-code{font-size:72px;font-weight:800;color:var(--text-4);margin-bottom:8px}
.error-title{font-size:24px;font-weight:700;margin-bottom:8px}
.error-desc{font-size:14px;color:var(--text-3);margin-bottom:24px}
.contract-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;transition:var(--transition)}
.contract-card:hover{box-shadow:var(--shadow)}
.contract-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.contract-number{font-size:16px;font-weight:700}
.contract-parties{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.contract-party{flex:1;padding:12px;background:#FAFBFC;border-radius:10px}
.contract-party .role{font-size:11px;color:var(--text-3);text-transform:uppercase;margin-bottom:4px}
.contract-party .name{font-size:13px;font-weight:600}
.payment-timeline{display:flex;align-items:center;gap:4px;margin-top:12px}
.payment-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.payment-dot.done{background:var(--green);color:#fff}
.payment-dot.pending{background:var(--yellow-light);color:var(--yellow);border:2px solid var(--yellow)}
.payment-dot.future{background:#F0F1F4;color:var(--text-4)}
.payment-line{flex:1;height:2px;background:#F0F1F4}
.payment-line.done{background:var(--green)}
.storage-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.storage-bar{height:12px;background:#F0F1F4;border-radius:6px;overflow:hidden;margin:12px 0}
.storage-bar .fill{height:100%;border-radius:6px}
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.settings-section h3{font-size:16px;font-weight:700;margin-bottom:16px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-light)}
.setting-row:last-child{border-bottom:none}
.setting-info .title{font-size:14px;font-weight:600}
.setting-info .desc{font-size:12px;color:var(--text-3);margin-top:2px}
.toggle{width:44px;height:24px;border-radius:12px;background:#D0D5DB;position:relative;cursor:pointer;transition:var(--transition)}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:var(--transition);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(20px)}
.access-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.access-header{padding:20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.camera-feed{width:100%;height:300px;background:#1A1D23;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.camera-feed img{width:100%;height:100%;object-fit:cover;opacity:.8}
.scan-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scan-frame{width:160px;height:200px;border:3px solid var(--green);border-radius:12px;position:relative}
.scan-line{position:absolute;left:0;right:0;height:2px;background:var(--green);animation:scanMove 2s infinite linear}
@keyframes scanMove{0%{top:0}100%{top:100%}}
.access-info{padding:20px}
.access-btn-group{display:flex;gap:10px;margin-top:16px}
.notif-list{display:flex;flex-direction:column;gap:8px}

.notif-item:hover{box-shadow:var(--shadow-sm);border-color:var(--text-4)}

.notif-content{flex:1}
.notif-content .title{font-size:14px;font-weight:600;margin-bottom:2px}
.notif-content .desc{font-size:13px;color:var(--text-3)}
.notif-content .time{font-size:11px;color:var(--text-4);margin-top:4px}
.audit-entry{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-light)}
.audit-time{font-size:12px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;width:100px;flex-shrink:0}
.audit-action{font-size:13px}
.audit-action .user{font-weight:600}
.audit-action .action{color:var(--text-3)}
.audit-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-left:8px}
.audit-tag.create{background:var(--green-bg);color:var(--green-dark)}
.audit-tag.update{background:var(--blue-light);color:var(--blue)}
.audit-tag.delete{background:var(--red-light);color:var(--red)}
.audit-tag.login{background:var(--purple-light);color:var(--purple)}
.expense-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.expense-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-light)}
.expense-row:last-child{border-bottom:none}
.expense-cat{display:flex;align-items:center;gap:10px}
.expense-cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.expense-amount{font-size:16px;font-weight:700}
.expense-pct{font-size:12px;color:var(--text-3)}
.report-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;transition:var(--transition);cursor:pointer}
.report-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.report-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.report-card h4{font-size:15px;font-weight:700;margin-bottom:4px}
.report-card p{font-size:12px;color:var(--text-3)}
.leasing-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;transition:var(--transition)}
.leasing-card:hover{box-shadow:var(--shadow)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.empty-icon{width:80px;height:80px;margin-bottom:16px;opacity:.3}
.empty-title{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--text-3);margin-bottom:20px}
.stat-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.stat-mini{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-mini .val{font-size:22px;font-weight:800;color:var(--text)}

.chart-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-bar-fill{width:100%;border-radius:6px 6px 0 0;transition:height .5s ease}

}
